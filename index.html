const dim=i=>[i.width||i.naturalWidth,i.height||i.naturalHeight];
function calc(iw,ih){
  const w=+$("#w").value,h=+$("#h").value,keep=$("#keep").checked;
  if(!w&&!h)return{w:iw,h:ih};
  if(exact&&w&&h)return{w,h,cover:true};            // preset: crop to fill exact size
  if(keep){if(w&&h){const s=Math.min(w/iw,h/ih);return{w:Math.round(iw*s),h:Math.round(ih*s)}}
    return w?{w,h:Math.round(ih*w/iw)}:{w:Math.round(iw*h/ih),h}}
  return{w:w||iw,h:h||ih};
}
function draw(img,d,s,png){
  const c=document.createElement("canvas");c.width=Math.max(1,Math.round(d.w*s));c.height=Math.max(1,Math.round(d.h*s));
  const x=c.getContext("2d"),[iw,ih]=dim(img);
  if(!png){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}   // white behind transparency for JPG
  x.imageSmoothingQuality="high";
  if(d.cover){const r=Math.max(c.width/iw,c.height/ih),sw=c.width/r,sh=c.height/r;x.drawImage(img,(iw-sw)/2,(ih-sh)/2,sw,sh,0,0,c.width,c.height)}
  else x.drawImage(img,0,0,c.width,c.height);
  return c;
}
const blob=(c,type,q)=>new Promise(r=>c.toBlob(r,type,q));
/* Binary search on quality (JPG/WebP) or on scale (PNG) to land just under max bytes */
async function squeeze(img,d,type,max){
  const png=type=="image/png";
  if(!max)return{b:await blob(draw(img,d,1,png),type,.92)};
  if(png){
    let b=await blob(draw(img,d,1,true),type);if(b.size<=max)return{b};
    let lo=.05,hi=1,best=null;
    for(let i=0;i<9;i++){const m=(lo+hi)/2,x=await blob(draw(img,d,m,true),type);if(x.size<=max){best=x;lo=m}else hi=m}
    return best?{b:best,scaled:true}:{b:await blob(draw(img,d,.05,true),type),fail:true};
  }
  const c=draw(img,d,1,false);
  let b=await blob(c,type,.95);if(b.size<=max)return{b};
  let lo=.02,hi=.95,best=null;
  for(let i=0;i<10;i++){const m=(lo+hi)/2,x=await blob(c,type,m);if(x.size<=max){best=x;lo=m}else hi=m}
  return best?{b:best}:{b:await blob(c,type,.02),fail:true};
}
const fmtKB=n=>n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB";
const ext=ty=>ty=="image/png"?"png":ty=="image/webp"?"webp":"jpg";

/* ---------- 6. Main run ---------- */
$("#go").onclick=async()=>{
  const msg=$("#msg");msg.className="msg";
  if(!files.length){msg.className="msg err";msg.textContent=t("none");return}
  const type=$("#fmt").value,kb=+$("#kb").value,max=kb>0?kb*1024:0;
  outs.forEach(o=>{URL.revokeObjectURL(o.u);URL.revokeObjectURL(o.o)});outs=[];
  $("#go").disabled=true;$("#pg").hidden=false;$("#pg").value=0;
  let anyFail=false,anyScaled=false;
  try{
    for(let i=0;i<files.length;i++){
      msg.textContent=`${t("wait")} ${i+1}/${files.length}…`;
      await new Promise(r=>setTimeout(r,30));                    // let the UI repaint
      try{
        const img=await load(files[i]),[iw,ih]=dim(img),d=calc(iw,ih),r=await squeeze(img,d,type,max);
        if(img.close)img.close();
        if(r.fail)anyFail=true;if(r.scaled)anyScaled=true;
        outs.push({name:`photochhota-${i+1}.${ext(type)}`,b:r.b,fail:r.fail,orig:files[i].size,u:URL.createObjectURL(r.b),o:URL.createObjectURL(files[i])});
      }catch(e){console.error(e);msg.className="msg err";msg.textContent=t("err")}
      $("#pg").value=(i+1)/files.length;
    }
    if(!msg.classList.contains("err"))msg.textContent=anyFail?t("fail"):(anyScaled?t("scaled")+" ":"")+t("done");
    if(anyFail)msg.className="msg err";
  }catch(e){console.error(e);msg.className="msg err";msg.textContent=t("err")}
  $("#go").disabled=false;$("#pg").hidden=true;showResults();
};

/* ---------- 7. Results + download ---------- */
function showResults(){
  $("#out").innerHTML=outs.map((o,i)=>{
    const p=Math.round((1-o.b.size/o.orig)*100);
    return `<div class="res"><div class="cmp"><figure><img src="${o.o}" alt=""><figcaption>${t("before")}: ${fmtKB(o.orig)}</figcaption></figure>
<figure><img src="${o.u}" alt=""><figcaption>${t("after")}: ${fmtKB(o.b.size)}</figcaption></figure></div>
<p class="stat">${t("saved")}: <span class="${p>=0&&!o.fail?"ok":"er"}">${p}%</span></p>
<a class="btn" href="${o.u}" download="${o.name}">${t("dl")} (${o.name})</a></div>`}).join("");
  $("#all").hidden=outs.length<2;
}
$("#all").onclick=async()=>{for(const o of outs){const a=document.createElement("a");a.href=o.u;a.download=o.name;document.body.appendChild(a);a.click();a.remove();await new Promise(r=>setTimeout(r,500))}};

render();
</script>
</body>
